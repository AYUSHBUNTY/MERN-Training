<!DOCTYPE html>
<html>
    <head>
        <title>Grid example</title>
        <style>
            .container{
                display: grid;
                grid-template-columns: auto auto auto auto ;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
        </div>
    </body>
</html>
